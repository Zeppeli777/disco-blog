# —— 主题配置 ——

# 导航（模拟游戏主菜单，hover 有 flavor text）
menu:
  - label: 继续阅读
    url: /
    flavor: 回到瑞瓦肖。这里没有时间，只有地点。
  - label: 案件档案
    url: /archives/
    flavor: 每一篇文字都是一桩尚未了结的案件。
  - label: 思维阁
    url: /thoughts/
    flavor: 有些想法在颅内结晶，久久不散。
  - label: 角色卡
    url: /about/
    flavor: 检视你自己。这不是一个好主意。

# 页脚台词（随机显示一条）
footers:
  - '半光已经熄灭。城市在等你的下一句话。'
  - '来，让我们海阔天空——'
  - '“我既不愿想象没有瑞瓦肖的生活，也不愿想象它有我。”'
  - 'Cindy the Skull 又画了什么新的壁画。'
  - '世界末日每小时都会来一次。然后它失败。'

# giscus 评论（基于 GitHub Discussions）
# repo_id / category_id 可用 README 里的命令自动获取后填入
giscus:
  enable: true
  repo: 'Zeppeli777/disco-blog'
  repo_id: ''            # 由 deploy 脚本自动填入
  category: '公告'
  category_id: ''        # 由 deploy 脚本自动填入
  mapping: 'pathname'
  reactions_enabled: 1
  lang: 'zh-CN'

# 角色卡（“关于”页）：四属性 + 24 技能，数值随意，改成你自己的
character:
  智力:
    color: intellect
    blurb: '把世界拆成零件再装回去——装回去的时候总会多出两个零件。'
    skills:
      - [逻辑, 5, '结论早于前提抵达。']
      - [百科, 3, '无所不知，包括错误的知识。']
      - [修辞, 2, '为一切立场辩护，包括互相矛盾的两个。']
      - [戏剧, 1, '从喉结的颤动里读出真相。']
      - [概念化, 2, '把平庸的周二说成史诗。']
      - [视觉演算, 1, '在脑海中弹道回溯雨的轨迹。']
  精神:
    color: psyche
    blurb: '心和城一样，潮湿，但还在运转。'
    skills:
      - [意志, 4, '对上瘾说不，对清醒说不。']
      - [内陆帝国, 3, '物件会说话。它们说的话是真的。']
      - [共情, 4, '从一句玩笑里听见求救。']
      - [权威, 1, '你最好立刻服从我。拜托了。']
      - [团队精神, 2, '隔着半个城市与队友同频。']
      - [暗示, 1, '我知道你懂的。你懂我意思吧？']
  体质:
    color: physique
    blurb: '肉体的内部是一支随时可能政变的军队。'
    skills:
      - [耐力, 2, '心脏说：我尽力了。']
      - [电化学, 1, '万物皆是药物，包括这行字。']
      - [战栗, 3, '风穿过街道时告诉你这城市的心事。']
      - [半光, 1, '预备役暴力，永久待机。']
      - [疼痛阈值, 2, '把伤害计为经验值。']
      - [体能, 1, '胳膊建议你冷静，但它自己也冷寂。']
  机能:
    color: motorics
    blurb: '肉身之外的秩序，衬衫的褶皱是最后的体面。'
    skills:
      - [手眼协调, 2, '投掷的成功率是超自然的。']
      - [感知, 3, '先于意识看见细节。']
      - [反应速度, 3, '比大脑快半拍的你。']
      - [处世经验, 2, '表现得像个体面人，直到成为。']
      - [交感, 2, '和机器说话时你们真的在交流。']
      - [镇定, 2, '扑克脸之下，是十二种表情。']
